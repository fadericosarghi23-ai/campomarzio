# Deploy statico su Netlify.
# Il dominio canonico è in astro.config.mjs (SITE_URL).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5.18 usa rolldown/vite 8: servono engine recenti
  NODE_VERSION = "20"
  # il lockfile generato su Windows fa saltare il binding nativo per Linux (npm#4828):
  # su Netlify si installa fresco
  NPM_FLAGS = "--no-package-lock"

# Vecchi indirizzi del sito WordPress (www.campomarzio.name) -> nuove rotte (301)
[[redirects]]
  from = "/projects-progetti"
  to = "/progetti/"
  status = 301

[[redirects]]
  from = "/office-studio"
  to = "/studio/"
  status = 301

[[redirects]]
  from = "/contact-contatti"
  to = "/contatti/"
  status = 301

[[redirects]]
  from = "/research-ricerca"
  to = "/servizi/#analisi"
  status = 301

[[redirects]]
  from = "/exhibition"
  to = "/progetti/"
  status = 301

# Le vecchie schede di dettaglio del portfolio (slug diversi) confluiscono nell'indice progetti
[[redirects]]
  from = "/portfolio/*"
  to = "/progetti/"
  status = 301
